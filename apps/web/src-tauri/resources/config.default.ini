; config_version = 1

[paths]
output = output
; format des notes generees : jpg ou pdf
output_format = jpg

[mailjet]
api_key =
api_secret =
from_email =
from_name =
; sandbox = true permet de tester sans envoyer reellement
sandbox = false

[mail]
; ID du template transactionnel Mailjet (Mailjet > Transactional > Templates).
; Le contenu de l'email (sujet, corps, design) est gere dans ce template.
; Variables disponibles dans le template : {{var:prenom}}, {{var:nom}},
; {{var:montant}}, {{var:acte}}, {{var:date}}, {{var:type_document}}.
template_id = 0
; sujet : laisser vide pour utiliser celui du template, ou surcharger ici.
subject =

; =============================================================================
; IA : fournisseurs (cle d'API par provider) + fonctionnalites (provider + prompt).
; Laisser api_key vide DESACTIVE l'IA pour ce provider (repli saisie manuelle).
; =============================================================================

[ai_provider_qwen]
; Qwen-VL-OCR via Alibaba DashScope (endpoint OpenAI-compatible, international hors Chine).
api_key =
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
model = qwen-vl-ocr

[ai_feature_facture_montant]
; Extraction du montant d'une facture scannee (provider vision + prompt editable).
provider = qwen
prompt = prompts/facture_montant.txt
enabled = true

[whatsapp]
; Message de repli par defaut pour l'envoi de documents par WhatsApp (si aucun message n'est associe a la categorie).
message_repli = Bonjour <PRENOM> <NOM>, voici votre <DOCUMENT>.
